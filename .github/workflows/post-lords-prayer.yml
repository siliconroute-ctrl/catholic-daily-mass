name: Post Lord's Prayer to YouTube (16 Sep 2026 special)
# ONE-DAY special: posts the Lord's Prayer to YouTube only, every 2 hours,
# 8am-8pm South Africa time, on 16 September 2026 only. Each run is
# independent (own TTS audio + a freshly random backdrop photo).
#
# Safe to leave in the repo after that date: the script itself
# (scripts/post-lords-prayer-to-youtube.js) hard-codes the allowed date and
# exits cleanly, doing nothing, on any other day — this cron does not need
# to be manually removed afterward.

on:
  # SCHEDULE TEMPORARILY DISABLED (16 Sep 2026): YT_REFRESH_TOKEN currently
  # points at the wrong YouTube channel (@HolyCatholicMass instead of the
  # real @catholicmass channel, which holds real subscriber history and
  # irreplaceable family content) — 3 of today's occurrences already posted
  # there in error. Re-enable the schedule block below once a
  # verified-correct refresh token is saved. workflow_dispatch still works
  # for manual, deliberate runs in the meantime.
  # schedule:
  #   # 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00 UTC
  #   # = 8am, 10am, 12pm, 2pm, 4pm, 6pm, 8pm South Africa time.
  #   - cron: "0 6,8,10,12,14,16,18 * * *"
  workflow_dispatch: {}

concurrency:
  group: post-lords-prayer
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Ensure ffmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Write Google credentials
        run: |
          echo "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Post Lord's Prayer to YouTube
        run: node scripts/post-lords-prayer-to-youtube.js
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
